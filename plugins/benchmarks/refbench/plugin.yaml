type: benchmark
key: refbench
name: RefactorBench
language: python
setups: [s1, s1_lsp, s1_eval, s2_rag_naive, s2_rag_ast, s3]
facets:
  - {key: mode, label: Prompt mode}
  - {key: repo, label: Project}
prompt:
  template: prompts/task.md
  appliesTo: every task, in each of the three prompt modes
  # The dataset's instructions were written against the upstream projects, so a
  # task asks for `requests/utils.py` in a checkout that keeps that file at
  # `src/requests/utils.py`. The task records the directory in `cwd_hint`; naming
  # it here is what puts the difference in the prompt instead of leaving every
  # agent to find it by failed reads.
  pathsRelativeTo: params.cwd_hint
  variables:
    - name: task.instructions
      summary: The refactoring the task asks for, in the mode this task was exported with.
      required: true
data:
  bootstrap: data_bootstrap.py
evaluation:
  capture: [git_diff, events_metrics]
  verify:
    - {preset: workspace_changed}
    - preset: python_tests
      config:
        test_from: params.test_file
        compat_shim: py39_ast
        cwd_hint_from: params.cwd_hint
        sys_path_repo_root: true
        timeout: 300
  passed: "workspace_changed and python_tests"
display:
  tabs: {output: Diff, response: Response}
